{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Trugene</title>

    <style>
        .hero-slider{
            position:relative;
            width:100%;
            height:70vh;
            overflow:hidden;
        }
        .hero-slide{
            position:absolute;
            inset:0;
            background-size:cover;
            background-position:center;
            opacity:0;
        }
        .hero-slide.active{
            opacity:1;
        }
        .hero-slide::before{
            content:"";
            position:absolute;
            inset:0;
            background:rgba(0,0,0,.45);
        }
        .hero-content{
            position:absolute;
            top:50%;
            left:8%;
            transform:translateY(-50%);
            color:#fff;
            max-width:520px;
            z-index:2;
        }
        .hero-content h1{
            font-size:3rem;
            margin-bottom:10px;
        }
        .hero-content p{
            font-size:1.2rem;
            margin-bottom:18px;
        }
        .hero-content a{
            display:inline-block;
            padding:12px 26px;
            background:#0d6efd;
            color:#fff;
            text-decoration:none;
            border-radius:6px;
            font-weight:600;
        }
        nav{
            padding:15px;
            background:#222;
            color:#fff;
        }
    </style>
</head>
<body>

<nav>
    <b>Trugene</b>
</nav>

{% block content %}{% endblock %}

<script>
document.addEventListener("DOMContentLoaded", function(){
    const slides = document.querySelectorAll(".hero-slide");
    let i = 0;
    setInterval(function(){
        slides[i].classList.remove("active");
        i = (i + 1) % slides.length;
        slides[i].classList.add("active");
    }, 4000);
});
</script>

</body>
</html>
