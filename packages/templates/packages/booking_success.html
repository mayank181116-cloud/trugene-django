{% extends "packages/base.html" %}

{% block title %}Booking Successful{% endblock %}

{% block content %}

<style>
    .success-box{
        max-width:420px;
        margin:80px auto;
        padding:30px;
        background:#fff;
        border-radius:14px;
        box-shadow:0 8px 25px rgba(0,0,0,.1);
        text-align:center;
    }

    .success-icon{
        font-size:48px;
        color:#28a745;
        margin-bottom:12px;
    }

    .success-box h2{
        margin-bottom:10px;
    }

    .success-text{
        color:#555;
        margin-bottom:20px;
    }

    .success-btn{
        display:inline-block;
        padding:12px 26px;
        background:#0d6efd;
        color:#fff;
        text-decoration:none;
        border-radius:8px;
        font-weight:600;
    }

    .success-btn:hover{
        background:#084298;
    }
</style>

<div class="success-box">

    <div class="success-icon">✔</div>

    <h2>Booking Successful</h2>

    <div class="success-text">
        Your test has been booked successfully.<br>
        Our team will contact you shortly.
    </div>

    <a href="/packages/" class="success-btn">
        Back to Packages
    </a>

</div>

{% endblock %}
