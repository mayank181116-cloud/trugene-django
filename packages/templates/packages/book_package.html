{% extends "packages/base.html" %}

{% block title %}Book Package{% endblock %}

{% block content %}

<style>
    .book-container{
        max-width:420px;
        margin:60px auto;
        padding:25px;
        background:#fff;
        border-radius:10px;
        box-shadow:0 6px 20px rgba(0,0,0,0.1);
    }

    .book-container h2{
        text-align:center;
        margin-bottom:10px;
    }

    .book-container p{
        text-align:center;
        color:#555;
        margin-bottom:15px;
    }

    .price-box{
        text-align:center;
        font-size:20px;
        font-weight:700;
        margin-bottom:20px;
        color:#0d6efd;
    }

    .book-container input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:6px;
        margin-bottom:15px;
        font-size:16px;
    }

    .book-container button{
        width:100%;
        padding:12px;
        background:#0d6efd;
        color:#fff;
        border:none;
        border-radius:6px;
        font-size:16px;
        font-weight:600;
        cursor:pointer;
    }

    .book-container button:hover{
        background:#084298;
    }

    .note{
        text-align:center;
        font-size:12px;
        color:#777;
        margin-top:15px;
    }
</style>

<div class="book-container">

    <h2>{{ package.name }}</h2>

    <p>{{ package.short_description }}</p>

    <div class="price-box">
        ₹ {{ package.price }}
    </div>

    <form method="post">
        {% csrf_token %}
        <input
            type="text"
            name="phone"
            placeholder="Enter Mobile Number"
            required
        >
        <button type="submit">Proceed Securely</button>
    </form>

    <div class="note">
        We facilitate your test through our partner labs.
    </div>

</div>

{% endblock %}
