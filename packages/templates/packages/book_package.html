{% extends "packages/base.html" %}

{% block content %}

<h2>{{ package.name }}</h2>
<p>{{ package.short_description }}</p>
<p><strong>Price:</strong> ₹{{ package.price }}</p>

<form method="post">
    {% csrf_token %}

    <input
        type="text"
        name="phone"
        placeholder="Enter Mobile Number"
        required
        style="width:100%;padding:12px;margin-bottom:10px;"
    >

    <button
        type="submit"
        style="padding:10px 18px;background:#0a7cff;color:#fff;border:none;border-radius:5px;">
        Proceed
    </button>
</form>

{% endblock %}
